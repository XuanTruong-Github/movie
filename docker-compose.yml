services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kk-phim
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2222
    ports:
      - "2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2222/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    container_name: kk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
