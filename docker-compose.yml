services:
  kkphim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kkphim-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2222
    ports:
      - "2000:2222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2222/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
